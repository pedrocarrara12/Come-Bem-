spring.application.name=comebem-api

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/comebem}
spring.datasource.username=${POSTGRES_USER:comebem}
spring.datasource.password=${POSTGRES_PASSWORD:comebem_dev}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

springdoc.swagger-ui.path=/swagger-ui.html
